<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词慢慢记 · 高频滚动复习</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:#f7f3e8;color:#33383f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;min-height:100vh;padding:16px 16px 70px;}
.wrap{max-width:960px;margin:0 auto;}
.topbar{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px;}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;}
.logo{font-size:32px;line-height:1;}
.brand h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.5px;color:#3a3f47;}
.brand .sub{margin:0;font-size:13px;color:#93999f;text-align:center;}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.stat{background:#fffdf8;border-radius:14px;padding:8px 20px;text-align:center;border:1px solid #ece5d5;min-width:86px;}
.stat b{display:block;font-size:20px;color:#4a7fe0;line-height:1.3;}
.stat span{font-size:12px;color:#93999f;}
.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.nav-btn{background:#fffdf8;border:1.5px solid #ece5d5;border-radius:14px;padding:10px 14px;font-size:14px;font-family:inherit;color:#5b6470;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;}
.nav-btn:hover{background:#f2f6ff;border-color:#cfdefb;}
.nav-btn.active{background:#5b8def;border-color:#5b8def;color:#fff;box-shadow:0 4px 12px rgba(91,141,239,.28);}
.nav-btn.locked{opacity:.4;cursor:not-allowed;}
.nav-num{font-size:11px;opacity:.75;font-weight:800;}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:center;background:#fffdf8;border:1px solid #ece5d5;border-radius:16px;padding:14px 16px;margin-bottom:20px;}
.tool-group{display:flex;align-items:center;gap:8px;}
.tool-label{font-size:13px;color:#93999f;white-space:nowrap;}
.chip{background:#f4efe3;border:1.5px solid transparent;border-radius:11px;padding:8px 14px;font-size:14px;font-family:inherit;color:#5b5348;cursor:pointer;transition:all .2s ease;font-weight:600;min-height:40px;}
.chip:hover{background:#ece5d5;}
.chip.on{background:#5b8def;color:#fff;}
.chip.danger{color:#d9705f;}
.chip.danger:hover{background:#fdeeeb;}
input[type=range]{width:110px;accent-color:#5b8def;}
.rate-val{font-size:13px;color:#5b6470;min-width:44px;}
.card{background:#fffdf8;border-radius:22px;padding:30px 26px;border:1px solid #ece5d5;box-shadow:0 6px 24px rgba(180,165,130,.10);animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.part-title{font-size:14px;font-weight:800;color:#5b8def;letter-spacing:1px;margin-bottom:6px;text-align:center;}
.hint{font-size:14px;color:#93999f;margin-bottom:22px;text-align:center;}
.word-big{font-size:46px;font-weight:800;color:#2f3542;letter-spacing:1px;text-align:center;margin:10px 0 4px;word-break:break-word;}
.syllables{font-size:18px;color:#8a94a3;text-align:center;margin-bottom:6px;letter-spacing:2px;}
.phonetic{font-size:19px;color:#8a94a3;text-align:center;margin-bottom:18px;}
.meaning{font-size:26px;color:#3a3f47;text-align:center;margin-bottom:10px;font-weight:600;}
.sentence-box{background:#f6f9ff;border-left:4px solid #c3d6f7;border-radius:0 14px 14px 0;padding:14px 18px;margin:18px 0;text-align:left;}
.sentence-en{font-size:19px;color:#3a4a63;font-weight:600;margin-bottom:4px;}
.sentence-cn{font-size:15px;color:#7d8794;}
/* 用法块样式 */
.usage-box{background:#fff;border:2px solid #e7e0d0;border-radius:14px;padding:14px 18px;margin-bottom:12px;cursor:pointer;transition:all .2s;display:flex;gap:12px;align-items:flex-start;}
.usage-box:hover{border-color:#cfdefb;background:#fbfcff;}
.usage-box.active{border-color:#5fbf8b;background:#f0fbf5;box-shadow:0 2px 8px rgba(95,191,139,.15);}
.usage-check{width:24px;height:24px;border-radius:6px;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .2s;color:#fff;font-weight:bold;}
.usage-box.active .usage-check{background:#5fbf8b;border-color:#5fbf8b;}
.usage-text{font-size:16px;color:#3a3f47;line-height:1.5;}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.btn{border:none;border-radius:14px;padding:14px 26px;font-size:1.05rem;font-family:inherit;cursor:pointer;transition:all .22s ease;min-height:50px;font-weight:700;}
.btn.primary{background:#5b8def;color:#fff;box-shadow:0 4px 12px rgba(91,141,239,.25);}
.btn.primary:hover{background:#4272d7;transform:translateY(-1px);}
.btn.ghost{background:#fff;color:#4a7fe0;border:2px solid #dbe7fd;}
.btn.ghost:hover{background:#f2f6ff;}
.btn.green{background:#5fbf8b;color:#fff;box-shadow:0 4px 12px rgba(95,191,139,.25);}
.btn.green:hover{background:#4aa877;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.mask-box{text-align:center;padding:20px 14px;border-radius:16px;background:#faf7ef;margin:14px 0;}
.blur-target{filter:blur(11px);opacity:.5;user-select:none;transition:filter .3s ease,opacity .3s ease;}
.mask-box.revealed .blur-target{filter:none;opacity:1;}
.blank-display{text-align:center;font-size:46px;font-weight:800;letter-spacing:3px;margin:30px 0;color:#2f3542;}
.blank-display .blank{color:#5b8def;border-bottom:3px solid #5b8def;padding:0 6px;}
.fam-wrap{margin-top:26px;padding-top:22px;border-top:1px dashed #e7e0d0;}
.fam-title{font-size:14px;color:#93999f;text-align:center;margin-bottom:12px;}
.fam-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.fam-btn{background:#f6f2e8;border:2px solid #e7e0d0;border-radius:14px;padding:10px 20px;font-size:15px;font-family:inherit;color:#5b5348;cursor:pointer;transition:all .2s ease;font-weight:700;min-height:48px;}
.fam-btn:hover{transform:translateY(-1px);}
.fam-btn.active.lv0{background:#ef8b83;border-color:#ef8b83;color:#fff;}
.fam-btn.active.lv1{background:#f0b246;border-color:#f0b246;color:#fff;}
.fam-btn.active.lv2{background:#5fbf8b;border-color:#5fbf8b;color:#fff;}
.fam-btn.active.lv3{background:#5b8def;border-color:#5b8def;color:#fff;}
.weak-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.weak-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#faf7ef;border-radius:14px;padding:12px 16px;flex-wrap:wrap;}
.weak-word{font-size:20px;font-weight:800;color:#2f3542;}
.weak-ph{font-size:14px;color:#8a94a3;font-weight:400;}
.weak-mean{font-size:15px;color:#5b6470;}
.weak-fam{display:flex;gap:6px;flex-wrap:wrap;}
.mini-fam{background:#fff;border:1.5px solid #e7e0d0;border-radius:10px;padding:6px 10px;font-size:13px;font-family:inherit;color:#6b7280;cursor:pointer;transition:all .2s;font-weight:700;}
.mini-fam:hover{background:#f2f6ff;}
.mini-fam.active.lv0{background:#ef8b83;border-color:#ef8b83;color:#fff;}
.mini-fam.active.lv1{background:#f0b246;border-color:#f0b246;color:#fff;}
.mini-fam.active.lv2{background:#5fbf8b;border-color:#5fbf8b;color:#fff;}
.mini-fam.active.lv3{background:#5b8def;border-color:#5b8def;color:#fff;}
.empty-tip{text-align:center;color:#93999f;font-size:16px;padding:30px 10px;line-height:1.9;}
.progress{text-align:center;font-size:13px;color:#a8a08f;margin-top:18px;}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:rgba(58,63,71,.94);color:#fff;padding:12px 22px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:999;max-width:88vw;text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.import-area{width:100%;min-height:130px;padding:14px;border:2px solid #e7e0d0;border-radius:14px;font-family:inherit;font-size:15px;line-height:1.9;background:#fdfbf5;color:#3a3f47;outline:none;resize:vertical;}
.import-area:focus{border-color:#5b8def;}
.ai-status{text-align:center;font-size:14px;color:#5b8def;min-height:24px;margin-top:10px;font-weight:600;}
@media (max-width:600px){
  body{padding:12px 10px 70px;}
  .card{padding:22px 16px;border-radius:18px;}
  .word-big,.blank-display{font-size:36px;}
  .meaning{font-size:22px;}
  .btn{padding:13px 18px;font-size:1rem;}
  .stat{min-width:70px;padding:6px 12px;}
  .stat b{font-size:18px;}
  input[type=range]{width:80px;}
}
</style>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌱</span>
      <div>
        <h1>单词慢慢记</h1>
        <p class="sub">高频滚动复习 · 考法提炼</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="nav" id="nav"></nav>

  <section class="toolbar">
    <div class="tool-group"><span class="tool-label">模式</span><button class="chip" id="chipSeq">自由跳转</button></div>
    <div class="tool-group"><span class="tool-label">自动朗读</span><button class="chip" id="chipAuto">关</button></div>
    <div class="tool-group"><span class="tool-label">语速</span><input type="range" id="rateRange" min="0.7" max="1.3" step="0.05" value="0.9"><span class="rate-val" id="rateVal">0.90×</span></div>
    <div class="tool-group"><button class="chip danger" id="btnResetAll">重置熟悉度</button></div>
  </section>

  <main id="stage"></main>
</div>

<div id="toast" class="toast"></div>

<script>
const DEFAULT_WORD_LIST = [
  {word:"apple", phonetic:"/ˈæpl/", syllables:"ap-ple", meaning:"n. 苹果", sentence:"I eat an apple every morning.", sentenceCn:"我每天早上吃一个苹果。", usages:["可数名词，表示一个苹果","常搭配动词 eat, buy"]},
  {word:"look after", phonetic:"/lʊk ˈɑːftə(r)/", syllables:"look af-ter", meaning:"照顾，照料（短语）", sentence:"Please look after my dog.", sentenceCn:"请照顾我的狗。", usages:["及物动词短语，后接宾语","同义替换：take care of"]},
  {word:"because", phonetic:"/bɪˈkəz/", syllables:"be-cause", meaning:"conj. 因为", sentence:"I like summer because I can swim.", sentenceCn:"我喜欢夏天，因为我可以游泳。", usages:["引导原因状语从句","常与 of 连用（because of + 名词）"]}
];

const STORAGE_KEY_FAM   = 'word_fam_v1';
const STORAGE_KEY_SET   = 'word_settings_v1';
const STORAGE_KEY_WORDS = 'word_list_v1';
const STORAGE_KEY_USAGE = 'word_usage_checked_v1';

const FAM_LEVELS = [
  { key:0, name:'陌生', short:'陌生', weight:8, tip:'多见面几次就记住啦～' },
  { key:1, name:'有点印象', short:'印象', weight:4, tip:'已经有感觉了，继续保持！' },
  { key:2, name:'基本记住', short:'基本', weight:2, tip:'很不错，再复习一遍就更稳啦～' },
  { key:3, name:'熟练', short:'熟练', weight:1, tip:'太棒啦！偶尔回来看看就行～' }
];

// 更新后的环节列表
const PARTS = [
  { n:1, name:'初识单词' },
  { n:2, name:'考法用法' },
  { n:3, name:'例句学习' },
  { n:4, name:'遮挡猜词' },
  { n:5, name:'乱序遮挡' },
  { n:6, name:'音节挖空' },
  { n:7, name:'看中默写' },
  { n:8, name:'随机听写' },
  { n:9, name:'复习专区' },
  { n:10, name:'单词库' }
];

const state = { part:1, current:null, history:[], revealed:false, maskMode:'cn',
  syll:null, sessionMarked:new Set(), weakOnly:false, seqMode:false,
  autoSpeak:false, rate:0.9, maxUnlocked:1 };

let FAM = {};
let WORD_LIST = [];
let USAGE_CHECKED = {}; // 存储用法高亮状态
let recentWords = [];
let p4Order = [];
let p4Index = 0;
let cachedVoices = [];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
let toastTimer=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}

/* 数据加载与保存 */
function loadWordList(){
  try{const raw=localStorage.getItem(STORAGE_KEY_WORDS);if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length){WORD_LIST=arr.filter(x=>x&&x.word);return;}}}catch(e){}
  WORD_LIST=DEFAULT_WORD_LIST.map(x=>Object.assign({},x));
}
function saveWordList(list){
  WORD_LIST=list;
  try{localStorage.setItem(STORAGE_KEY_WORDS,JSON.stringify(list));}catch(e){toast('保存失败了～');}
  state.current=null;state.history=[];state.revealed=false;state.syll=null;state.weakOnly=false;
  recentWords=[];p4Order=[];p4Index=0;
}
function loadFam(){try{FAM=JSON.parse(localStorage.getItem(STORAGE_KEY_FAM)||'{}')||{};}catch(e){FAM={};}}
function getFam(word){const v=FAM[word];return (typeof v==='number'&&v>=0&&v<=3)?v:0;}
function setFam(word,lv){FAM[word]=lv;try{localStorage.setItem(STORAGE_KEY_FAM,JSON.stringify(FAM));}catch(e){}}

function loadUsageChecked(){try{USAGE_CHECKED=JSON.parse(localStorage.getItem(STORAGE_KEY_USAGE)||'{}')||{};}catch(e){USAGE_CHECKED={};}}
function setUsageChecked(word, idx, checked){
  if(!USAGE_CHECKED[word]) USAGE_CHECKED[word]=[];
  if(checked){ if(!USAGE_CHECKED[word].includes(idx)) USAGE_CHECKED[word].push(idx); }
  else { USAGE_CHECKED[word] = USAGE_CHECKED[word].filter(i=>i!==idx); }
  try{localStorage.setItem(STORAGE_KEY_USAGE,JSON.stringify(USAGE_CHECKED));}catch(e){}
}

function loadSettings(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY_SET)||'{}')||{};if(typeof s.seqMode==='boolean')state.seqMode=s.seqMode;if(typeof s.autoSpeak==='boolean')state.autoSpeak=s.autoSpeak;if(typeof s.rate==='number'&&s.rate>=0.7&&s.rate<=1.3)state.rate=s.rate;}catch(e){}}
function saveSettings(){try{localStorage.setItem(STORAGE_KEY_SET,JSON.stringify({seqMode:state.seqMode,autoSpeak:state.autoSpeak,rate:state.rate}));}catch(e){}}

/* TTS 朗读（强兼容苹果） */
function refreshVoices(){if(!('speechSynthesis' in window))return;try{cachedVoices=window.speechSynthesis.getVoices()||[];}catch(e){cachedVoices=[];}}
if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices;}

function speak(text){
  if(!text)return;
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('不支持朗读，跟着音标读吧～');return;}
  try{
    window.speechSynthesis.cancel(); // 先清空队列，防止苹果卡死
    
    // 直接同步执行，不要异步延迟
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang='en-US';u.rate=state.rate;u.pitch=1;u.volume=1;

    let voices = window.speechSynthesis.getVoices() || [];
    let en = voices.find(v=>/^en([-_](US|GB|AU|CA))?$/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en)u.voice=en;
    
    u.onerror = (e) => { console.log('TTS Error:', e); };
    
    // 播放
    window.speechSynthesis.speak(u);
    
    // 针对部分苹果系统的终极唤醒魔法
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  }catch(e){console.log(e);}
}

/* 选词逻辑（修复强制凑数问题） */
function getPool(){if(!state.weakOnly)return WORD_LIST;const weak=WORD_LIST.filter(w=>getFam(w.word)<=1);return weak.length?weak:WORD_LIST;}
function pickNextWord(){
  const pool=getPool();if(!pool.length)return null;
  const curWord=state.current?state.current.word:null;
  let cands=pool.filter(w=>w.word!==curWord);if(!cands.length)cands=pool;
  const weights=cands.map(w=>{let base=FAM_LEVELS[getFam(w.word)].weight;if(recentWords.includes(w.word))base*=0.2;return Math.max(base,0.05);});
  const total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;let picked=cands[cands.length-1];
  for(let i=0;i<cands.length;i++){r-=weights[i];if(r<=0){picked=cands[i];break;}}
  recentWords.push(picked.word);if(recentWords.length>Math.min(6, pool.length))recentWords.shift();
  return picked;
}

function renderStats(){
  let prof=0,weak=0;
  WORD_LIST.forEach(w=>{const lv=getFam(w.word);if(lv===3)prof++;if(lv<=1)weak++;});
  document.getElementById('stats').innerHTML=`
    <div class="stat"><b>${WORD_LIST.length}</b><span>总词数</span></div>
    <div class="stat"><b>${prof}</b><span>熟练</span></div>
    <div class="stat"><b>${weak}</b><span>薄弱</span></div>`;
}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=PARTS.map(p=>{
    const active=state.part===p.n;
    const locked=state.seqMode&&p.n<=8&&p.n>state.maxUnlocked;
    const badge=p.n<=8?'P'+p.n:(p.n===9?'🔁':'📚');
    return `<button class="nav-btn ${active?'active':''} ${locked?'locked':''}" data-part="${p.n}" ${locked?'disabled':''}><span class="nav-num">${badge}</span>${p.name}</button>`;
  }).join('');
  nav.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>gotoPart(parseInt(b.dataset.part,10))));
}

function render(){
  if(!WORD_LIST.length&&state.part!==10){
    document.getElementById('stage').innerHTML=`<div class="card" style="text-align:center;"><div class="part-title">还没有单词</div><div class="hint">去「单词库」输入英文，AI 帮你生成所有数据～</div><div class="row"><button class="btn primary" id="goBank">📚 去单词库</button></div></div>`;
    renderNav();renderStats();
    document.getElementById('goBank').addEventListener('click',()=>gotoPart(10));
    return;
  }
  if(state.seqMode&&state.part<=8){state.maxUnlocked=Math.max(state.maxUnlocked,state.part);}
  renderNav();renderStats();
  if(!state.current&&state.part<=8){state.current=pickNextWord();}
  const stage=document.getElementById('stage');
  switch(state.part){
    case 1:renderPart1(stage);break;
    case 2:renderPart2(stage);break;
    case 3:renderPart3(stage);break;
    case 4:renderPart4(stage,false);break;
    case 5:renderPart4(stage,true);break;
    case 6:renderPart6(stage);break;
    case 7:renderPart7(stage);break;
    case 8:renderPart8(stage);break;
    case 9:renderReview(stage);break;
    case 10:renderWordBank(stage);break;
  }
}

function famButtonsHTML(){
  const cur=getFam(state.current.word);
  return `<div class="fam-wrap"><div class="fam-title">这个词你现在有多熟？</div><div class="fam-row">${FAM_LEVELS.map(l=>`<button class="fam-btn lv${l.key} ${cur===l.key?'active':''}" data-lv="${l.key}">${l.name}</button>`).join('')}</div></div>`;
}
function bindFamButtons(){
  document.querySelectorAll('#stage .fam-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lv=parseInt(btn.dataset.lv,10);
      setFam(state.current.word,lv);
      state.sessionMarked.add(state.current.word);
      document.querySelectorAll('#stage .fam-btn').forEach(b=>b.classList.toggle('active',b===btn));
      toast(`已记为「${FAM_LEVELS[lv].name}」`);
      renderStats();
    });
  });
}
function seqNextHTML(){
  if(!state.seqMode||state.part>=9)return '';
  const next=state.part+1;
  const label=next<=8?`进入 Part${next} · ${PARTS[next-1].name} →`:'进入复习专区 →';
  return `<div class="row" style="margin-top:10px;"><button class="btn green" id="btnSeqNext">${label}</button></div>`;
}
function bindSeqNext(){
  const b=document.getElementById('btnSeqNext');if(!b)return;
  b.addEventListener('click',()=>{const next=state.part+1;state.maxUnlocked=Math.max(state.maxUnlocked,next);gotoPart(next);});
}

/* Part 1: 初识 */
function renderPart1(stage){
  const w=state.current;const lv=FAM_LEVELS[getFam(w.word)];
  stage.innerHTML=`<div class="card">
    <div class="part-title">Part 1 · 初识单词</div>

/* Part 6: 音节挖空 (原Part5) */
function makeBlanks(word){
  const letters=word.split('');const alphaIdx=[];
  for(let i=0;i<letters.length;i++){if(/[a-zA-Z]/.test(letters[i]))alphaIdx.push(i);}
  if(!alphaIdx.length)return{start:0,len:0,answer:''};
  let blankCount;if(alphaIdx.length<=4)blankCount=1;else if(alphaIdx.length<=7)blankCount=2;else blankCount=3;
  blankCount=Math.min(blankCount,alphaIdx.length);
  const maxStartPos=Math.max(0,alphaIdx.length-blankCount);
  let startPos=1+Math.floor(Math.random()*Math.max(1,maxStartPos));startPos=Math.min(startPos,maxStartPos);if(startPos<1)startPos=0;
  const start=alphaIdx[startPos];const endPos=Math.min(alphaIdx.length-1,startPos+blankCount-1);
  const len=alphaIdx[endPos]-start+1;
  return{start,len,answer:word.slice(start,start+len)};
}

/* AI 生成核心逻辑：增加音节、用法、优化短语 */
async function generateWordInfo(words,statusEl){
  if(typeof puter==='undefined'||!puter.ai){ throw new Error('Puter.js 未加载'); }
  const results={}; const batchSize=6;
  for(let i=0;i<words.length;i+=batchSize){
    const batch=words.slice(i,i+batchSize);
    if(statusEl)statusEl.textContent=`正在让 AI 补全第 ${i+1}～${Math.min(i+batchSize,words.length)} 个…`;

    const prompt=`你是资深的初一英语老师。请为下面每个英文单词（或短语）生成以下信息：
1. 音标 (用 / / 括起)
2. 音节划分 (如 ap-ple，短语用 - 连接)
3. 中文释义 (词性 + 意思，如果是短语，必须给出准确的中文翻译)
4. 简单的英文例句
5. 例句的中文翻译
6. 考法用法总结 (列出1-3条常见的考点或搭配，用分号 ; 隔开)

单词列表：
${batch.join('\n')}

请严格按以下格式返回，每个单词一行，字段用 ||| 隔开（别加多余解释）：
单词|||音标|||音节|||中文释义|||英文例句|||例句中文翻译|||用法1;用法2`;

    const response=await puter.ai.chat(prompt,{model:'openai/gpt-4o-mini'});
    const text=extractText(response);
    text.split(/\r?\n/).forEach(line=>{
      const parts=line.split('|||').map(s=>s.trim());
      if(parts.length<4)return;
      const word=parts[0].toLowerCase().replace(/[^a-z\s'-]/g,'').trim();
      if(!word)return;
      results[word]={
        phonetic:parts[1]||'',
        syllables:parts[2]||'',
        meaning:parts[3]||'',
        sentence:parts[4]||'',
        sentenceCn:parts[5]||'',
        usages: parts[6] ? parts[6].split(';').map(s=>s.trim()).filter(Boolean) : []
      };
    });
  }
  return results;
}

function extractText(response){
  if(!response)return '';
  if(typeof response==='string')return response;
  if(typeof response.text==='string')return response.text;
  if(response.message&&response.message.content){
    const c=response.message.content;
    if(typeof c==='string')return c;
    if(Array.isArray(c)&&c.length&&typeof c[0].text==='string')return c[0].text;
  }
  if(Array.isArray(response)&&response.length&&response[0].text)return response[0].text;
  try{return JSON.stringify(response);}catch(e){return '';}
}

function gotoPart(n){
  if(state.seqMode&&n<=8&&n>state.maxUnlocked){toast('请先完成前面的环节～');return;}
  state.part=n;state.revealed=false;state.syll=null;
  if(n===5){p4Order=shuffle([...getPool()]);p4Index=0;state.current=p4Order[0]||pickNextWord();}
  else if(n<=8&&!state.current){state.current=pickNextWord();}
  render();
}
function nextWord(){
  if(state.current){state.history.push(state.current);if(state.history.length>60)state.history.shift();}
  if(state.part===5){
    p4Index++;
    if(p4Index>=p4Order.length){
      // 修复强制凑数的BUG：有多少池子就刷多少，直接用当前池子重排
      p4Order=shuffle([...getPool()]);p4Index=0;
    }
    state.current=p4Order[p4Index]||pickNextWord();
  }else{state.current=pickNextWord();}
  state.revealed=false;state.syll=null;render();
  if(state.autoSpeak&&state.current&&state.part!==8)speak(state.current.word);
}
function prevWord(){
  if(!state.history.length){toast('已经是第一个啦～');return;}
  state.current=state.history.pop();state.revealed=false;state.syll=null;render();
}

function syncToolbar(){
  document.getElementById('chipSeq').textContent=state.seqMode?'顺序学习':'自由跳转';
  document.getElementById('chipSeq').classList.toggle('on',state.seqMode);
  document.getElementById('chipAuto').textContent=state.autoSpeak?'开':'关';
  document.getElementById('chipAuto').classList.toggle('on',state.autoSpeak);
  document.getElementById('rateRange').value=state.rate;
  document.getElementById('rateVal').textContent=state.rate.toFixed(2)+'×';
}
function bindToolbar(){
  document.getElementById('chipSeq').addEventListener('click',()=>{
    state.seqMode=!state.seqMode;
    saveSettings();syncToolbar();render();
  });
  document.getElementById('chipAuto').addEventListener('click',()=>{
    state.autoSpeak=!state.autoSpeak;
    saveSettings();syncToolbar();
  });
  document.getElementById('rateRange').addEventListener('input',e=>{
    state.rate=parseFloat(e.target.value);
    document.getElementById('rateVal').textContent=state.rate.toFixed(2)+'×';saveSettings();
  });
  document.getElementById('btnResetAll').addEventListener('click',()=>{
    if(!confirm('确定把所有单词熟悉度重置为「陌生」吗？'))return;
    FAM={};try{localStorage.removeItem(STORAGE_KEY_FAM);}catch(e){}
    state.sessionMarked.clear();recentWords=[];state.history=[];
    state.revealed=false;state.syll=null;state.weakOnly=false;state.current=pickNextWord();
    toast('已重置～');render();
  });
}

(function init(){
  loadWordList();loadFam();loadUsageChecked();loadSettings();syncToolbar();bindToolbar();
  if(WORD_LIST.length)state.current=pickNextWord();
  render();
})();
</script>
</body>
</html>
